name: Testes do Caroninhas Party
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check server.js
      - run: node --check public/script.js
  trivia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ronizada-quest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check src/server.js

# Nao faz deploy automatico; segredos nao sao necessarios para executar testes unitarios.
